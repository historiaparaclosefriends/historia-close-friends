<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Historia para Close Friends</title>


<style>

/* =========================
   BASE
   ========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #242424;

  background-color: #f4f0e8;

  background-image: url("fons.png");

  background-repeat: no-repeat;

  background-position:
    center top;

  background-size: cover;

  background-attachment: fixed;

}


/* =========================
   CONTENEDOR
   ========================= */

.page {

  width: 100%;

  max-width: 820px;

  margin: 0 auto;

  padding:
    35px 24px 35px;

}


/* =========================
   LOGO
   ========================= */

.logo {

  display: block;

  width: 440px;

  max-width: 78vw;

  height: auto;

  margin:
    0 auto 22px;

}


/* =========================
   TAGLINE
   ========================= */

.tagline {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 8px;

  flex-wrap: wrap;

  margin-bottom: 28px;

  font-size: 29px;

  line-height: 1.1;

  font-weight: 800;

}


.tagline .normal {

  color: #242424;

}


.tagline .green {

  display: inline-block;

  padding:
    8px 17px;

  border-radius: 14px;

  background: #62CE61;

  color: #ffffff;

  white-space: nowrap;

}


/* =========================
   BOTONES
   ========================= */

#mainButtons {

  display: flex;

  flex-direction: column;

  gap: 13px;

}


.main-button {

  display: flex;

  align-items: center;

  justify-content: center;

  width: 100%;

  min-height: 68px;

  padding:
    14px 20px;

  border-radius: 22px;

  background:
    rgba(
      255,
      253,
      250,
      0.97
    );

  color: #242424;

  text-decoration: none;

  font-size: 25px;

  font-weight: 800;

  line-height: 1.1;

  transition:
    transform 0.15s ease,
    color 0.15s ease;

}


.main-button:hover {

  transform:
    translateY(-1px);

}


/* =========================
   BIBLIOGRAFÍA
   ========================= */

.bibliography-wrapper {

  margin-top: 13px;

}


.bibliography-button {

  display: flex;

  align-items: center;

  justify-content: center;

  width: 100%;

  min-height: 68px;

  padding:
    14px 20px;

  border: none;

  border-radius: 22px;

  background:
    rgba(
      255,
      253,
      250,
      0.97
    );

  color: #242424;

  font-family: inherit;

  font-size: 25px;

  font-weight: 800;

  cursor: pointer;

  transition:
    transform 0.15s ease;

}


.bibliography-button:hover {

  transform:
    translateY(-1px);

}


/* =========================
   CONTENIDO BIBLIOGRAFÍA
   ========================= */

.bibliography-content {

  display: none;

  margin-top: 8px;

  padding:
    0 24px;

  border-radius: 22px;

  background:
    rgba(
      255,
      253,
      250,
      0.97
    );

}


.bibliography-content.open {

  display: block;

}


/* =========================
   ELEMENTOS BIBLIOGRAFÍA
   ========================= */

.bibliography-item {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  padding:
    16px 0;

  border-bottom:
    1px dashed #efb5c9;

  color: #242424;

  text-decoration: none;

  font-size: 18px;

  font-weight: 700;

  transition:
    color 0.15s ease;

}


.bibliography-item:last-child {

  border-bottom: none;

}


.bibliography-name {

  display: flex;

  align-items: center;

  gap: 10px;

}


.bibliography-icon {

  font-size: 19px;

  flex-shrink: 0;

}


.bibliography-arrow {

  font-size: 27px;

  line-height: 1;

  color: #242424;

  transition:
    color 0.15s ease;

  flex-shrink: 0;

}


/* =========================
   HOVER AZUL
   ========================= */

.bibliography-item:hover {

  color: #0072F2;

}


.bibliography-item:hover
.bibliography-arrow {

  color: #0072F2;

}


/* =========================
   FOOTER
   ========================= */

.footer {

  display: flex;

  justify-content: center;

  margin-top: 28px;

}


.instagram {

  display: inline-block;

  padding:
    11px 23px;

  border-radius: 14px;

  background: #f2b1c9;

  color: #242424;

  font-size: 17px;

  font-weight: 800;

}


/* =========================
   MÓVIL
   ========================= */

@media (max-width: 600px) {

  .page {

    padding:
      25px 15px 30px;

  }


  .logo {

    width: 88vw;

    max-width: 430px;

    margin-bottom: 18px;

  }


  .tagline {

    font-size: 23px;

    gap: 6px;

    margin-bottom: 23px;

  }


  .tagline .green {

    padding:
      7px 14px;

    border-radius: 12px;

  }


  #mainButtons {

    gap: 11px;

  }


  .main-button,
  .bibliography-button {

    min-height: 62px;

    padding:
      13px 16px;

    border-radius: 19px;

    font-size: 21px;

  }


  .bibliography-wrapper {

    margin-top: 11px;

  }


  .bibliography-content {

    padding:
      0 17px;

    border-radius: 19px;

  }


  .bibliography-item {

    padding:
      14px 0;

    font-size: 16px;

  }


  .bibliography-arrow {

    font-size: 24px;

  }


  .instagram {

    padding:
      10px 18px;

    font-size: 15px;

  }

}


</style>

</head>


<body>


<main class="page">


  <!-- =====================
       LOGO
       ===================== -->

  <img
    src="Recurso 1.png"
    class="logo"
    alt="Historia para Close Friends"
  >


  <!-- =====================
       FRASE
       ===================== -->

  <div class="tagline">

    <span class="normal">
      Aprende historia
    </span>

    <span class="green">
      sin turra
    </span>

  </div>


  <!-- =====================
       BOTONES PRINCIPALES
       ===================== -->

  <div id="mainButtons"></div>


  <!-- =====================
       BIBLIOGRAFÍA
       ===================== -->

  <div class="bibliography-wrapper">

    <button
      class="bibliography-button"
      id="bibliographyButton"
      onclick="toggleBibliography()"
    >
      📚 Bibliografía ▼
    </button>


    <div
      class="bibliography-content"
      id="bibliographyContent"
    ></div>

  </div>


  <!-- =====================
       FOOTER
       ===================== -->

  <div class="footer">

    <div class="instagram">
      @historiaparaclosefriends
    </div>

  </div>


</main>


<script>


/* =========================
   GOOGLE SHEETS
   ========================= */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSe9B5yAgd1vKXrHcK-ZezCLKeK4PuJgUHIkX6MBLaSPercQTCdJzCjpv9RR6_bYVP5Xo0C9Smzax5p/pub?gid=0&single=true&output=csv";


/* =========================
   ICONOS
   ========================= */

const buttonIcons = {

  "podcast": "🎧",

  "escuchar": "🎧",

  "ultimo": "🔥",

  "episodio": "🔥",

  "youtube": "📹"

};


/* =========================
   NORMALIZAR TEXTO
   ========================= */

function normalizeType(type) {

  return String(type || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .trim();

}


/* =========================
   CSV
   ========================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const char = text[i];

    const next = text[i + 1];


    if (
      char === '"' &&
      insideQuotes &&
      next === '"'
    ) {

      value += '"';

      i++;

    }

    else if (
      char === '"'
    ) {

      insideQuotes =
        !insideQuotes;

    }

    else if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(value);

      value = "";

    }

    else if (
      (char === "\n" ||
       char === "\r") &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }

      row.push(value);

      rows.push(row);

      row = [];

      value = "";

    }

    else {

      value += char;

    }

  }


  if (
    value !== "" ||
    row.length > 0
  ) {

    row.push(value);

    rows.push(row);

  }


  return rows;

}


/* =========================
   LIMPIAR
   ========================= */

function clean(value) {

  return String(
    value || ""
  )
  .trim()
  .replace(
    /^"|"$/g,
    ""
  );

}


/* =========================
   CARGAR SHEET
   ========================= */

async function loadLinks() {

  try {

    const response =
      await fetch(
        SHEET_URL
      );


    if (!response.ok) {

      throw new Error(
        "No se pudo cargar Google Sheets"
      );

    }


    const csv =
      await response.text();


    const rows =
      parseCSV(csv);


    if (
      rows.length < 2
    ) {

      return;

    }


    const headers =
      rows
      .shift()
      .map(
        header =>
          clean(header)
          .toLowerCase()
      );


    const tipoIndex =
      headers.indexOf("tipo");

    const nombreIndex =
      headers.indexOf("nombre");

    const urlIndex =
      headers.indexOf("url");

    const activoIndex =
      headers.indexOf("activo");

    const ordenIndex =
      headers.indexOf("orden");


    const links =
      rows
      .map(row => ({

        tipo:
          clean(
            row[tipoIndex]
          ),

        nombre:
          clean(
            row[nombreIndex]
          ),

        url:
          clean(
            row[urlIndex]
          ),

        activo:
          clean(
            row[activoIndex]
          )
          .toUpperCase()
          === "TRUE",

        orden:
          Number(
            clean(
              row[ordenIndex]
            )
          ) || 0

      }))
      .filter(
        item =>
          item.nombre &&
          item.url &&
          item.activo
      );


    links.sort(
      (a, b) =>
        a.orden - b.orden
    );


    renderButtons(
      links
    );


    renderBibliography(
      links
    );

  }

  catch(error) {

    console.error(error);

    renderFallbackButtons();

  }

}


/* =========================
   BOTONES
   ========================= */

function renderButtons(
  links
) {

  const container =
    document.getElementById(
      "mainButtons"
    );


  container.innerHTML = "";


  const mainLinks =
    links.filter(
      item =>
        normalizeType(
          item.tipo
        ) !== "bibliografia"
    );


  mainLinks
    .slice(0, 3)
    .forEach(
      link => {

        const button =
          document.createElement(
            "a"
          );


        const type =
          normalizeType(
            link.tipo
          );


        const icon =
          buttonIcons[type]
          || "🔗";


        button.className =
          "main-button";


        button.href =
          link.url;


        button.target =
          "_blank";


        button.rel =
          "noopener noreferrer";


        button.textContent =
          `${icon} ${link.nombre}`;


        container.appendChild(
          button
        );

      }
    );

}


/* =========================
   BIBLIOGRAFÍA
   ========================= */

function renderBibliography(
  links
) {

  const container =
    document.getElementById(
      "bibliographyContent"
    );


  container.innerHTML = "";


  const bibliography =
    links.filter(
      item =>
        normalizeType(
          item.tipo
        ) === "bibliografia"
    );


  bibliography.forEach(
    link => {

      const item =
        document.createElement(
          "a"
        );


      item.className =
        "bibliography-item";


      item.href =
        link.url;


      item.target =
        "_blank";


      item.rel =
        "noopener noreferrer";


      item.innerHTML = `

        <span
          class="bibliography-name"
        >

          <span
            class="bibliography-icon"
          >
            📄
          </span>

          <span>
            ${escapeHTML(
              link.nombre
            )}
          </span>

        </span>


        <span
          class="bibliography-arrow"
        >
          ↗
        </span>

      `;


      container.appendChild(
        item
      );

    }
  );

}


/* =========================
   ABRIR / CERRAR
   ========================= */

function toggleBibliography() {

  const content =
    document.getElementById(
      "bibliographyContent"
    );


  const button =
    document.getElementById(
      "bibliographyButton"
    );


  const open =
    content.classList
    .contains("open");


  if (open) {

    content.classList
      .remove("open");

    button.textContent =
      "📚 Bibliografía ▼";

  }

  else {

    content.classList
      .add("open");

    button.textContent =
      "📚 Bibliografía ▲";

  }

}


/* =========================
   FALLBACK
   ========================= */

function renderFallbackButtons() {

  const container =
    document.getElementById(
      "mainButtons"
    );


  container.innerHTML = `

    <a
      class="main-button"
      href="#"
    >
      🎧 ¡Escúchalo ya!
    </a>


    <a
      class="main-button"
      href="#"
    >
      🔥 Último episodio
    </a>


    <a
      class="main-button"
      href="#"
    >
      📹 YouTube
    </a>

  `;

}


/* =========================
   SEGURIDAD
   ========================= */

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   INICIAR
   ========================= */

loadLinks();


</script>


</body>

</html>
