<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Historia para Close Friends</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #222;

  background-color: #eeece1;

  background-image: url("fons.png");
  background-position: center top;
  background-repeat: repeat-y;
  background-size: 100% auto;
}


/* =========================
   CONTENEDOR GENERAL
   ========================= */

.container {
  width: 100%;
  max-width: 1000px;

  margin: 0 auto;

  padding:
    25px
    25px
    40px;

  text-align: center;
}


/* =========================
   LOGO
   ========================= */

.logo {
  display: block;

  width: 520px;
  max-width: 78%;

  height: auto;

  margin:
    0 auto 0;
}


/* =========================
   FRASE
   ========================= */

.tagline {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 7px;

  margin:
    -2px auto 24px;

  font-size: 25px;

  line-height: 1;

  font-weight: 800;
}

.tagline-text {
  color: #222;
}

.tagline-highlight {
  background: #58d05c;

  color: white;

  padding:
    8px
    15px;

  border-radius: 12px;

  font-weight: 800;
}


/* =========================
   BOTONES
   ========================= */

#mainButtons {
  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 10px;

  width: 100%;
}

.main-button {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 72%;
  max-width: 700px;

  min-height: 54px;

  padding:
    9px
    18px;

  border: none;

  border-radius: 20px;

  background: #fffdfb;

  color: #222;

  text-decoration: none;

  font-size: 23px;

  font-weight: 800;

  line-height: 1.1;

  box-shadow:
    0 2px 5px rgba(0,0,0,0.04);

  transition:
    transform 0.15s ease,
    background-color 0.15s ease;
}

.main-button:hover {
  background: #ffffff;

  transform: translateY(-1px);
}


/* =========================
   BIBLIOGRAFÍA
   ========================= */

#bibliography {
  width: 72%;
  max-width: 700px;

  margin:
    0 auto;
}


/* BOTÓN BIBLIOGRAFÍA */

.bibliography-button {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 100%;

  min-height: 54px;

  padding:
    9px
    18px;

  margin: 0;

  border: none;

  border-radius: 20px;

  background: #fffdfb;

  color: #222;

  font-family: inherit;

  font-size: 23px;

  font-weight: 800;

  line-height: 1.1;

  cursor: pointer;

  box-shadow:
    0 2px 5px rgba(0,0,0,0.04);

  transition:
    transform 0.15s ease,
    background-color 0.15s ease;
}

.bibliography-button:hover {
  background: #ffffff;

  transform: translateY(-1px);
}


/* =========================
   LISTA BIBLIOGRAFÍA
   ========================= */

.bibliography-list {
  display: none;

  width: 100%;

  margin-top: 7px;

  padding:
    3px
    22px;

  background: #fffdfb;

  border-radius: 17px;

  text-align: left;
}

.bibliography-list.open {
  display: block;
}


/* =========================
   CADA RECURSO
   ========================= */

.bibliography-item {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  width: 100%;

  padding:
    14px
    2px;

  border-bottom:
    1px dashed #f2b6ce;

  color: #222;

  text-decoration: none;

  font-size: 18px;

  font-weight: 700;

  line-height: 1.2;

  transition:
    color 0.15s ease;
}

.bibliography-item:last-child {
  border-bottom: none;
}

.bibliography-item:hover {
  color: #0877ed;
}


/* DOCUMENTO */

.document {
  display: flex;

  align-items: center;

  gap: 10px;

  min-width: 0;
}

.document-icon {
  flex-shrink: 0;

  font-size: 19px;
}

.document-name {
  overflow: hidden;

  text-overflow: ellipsis;
}


/* FLECHA */

.arrow {
  flex-shrink: 0;

  font-size: 24px;

  font-weight: 400;

  color: #222;

  transition:
    color 0.15s ease;
}

.bibliography-item:hover .arrow {
  color: #0877ed;
}


/* =========================
   FOOTER
   ========================= */

.footer {
  margin-top: 25px;

  text-align: center;
}

.instagram {
  display: inline-block;

  padding:
    8px
    18px;

  border-radius: 15px;

  background: #FFDBF2;

  color: #ed711a;

  font-size: 17px;

  font-weight: 800;

  line-height: 1.1;
}


/* =========================
   MÓVIL
   ========================= */

@media (max-width: 600px) {

  .container {
    padding:
      15px
      12px
      30px;
  }

  .logo {
    width: 90%;

    max-width: 430px;
  }

  .tagline {
    font-size: 19px;

    gap: 5px;

    margin-bottom: 19px;
  }

  .tagline-highlight {
    padding:
      7px
      11px;

    border-radius: 10px;
  }

  #mainButtons {
    gap: 9px;
  }

  .main-button,
  .bibliography-button {
    width: 90%;

    min-height: 51px;

    padding:
      8px
      12px;

    border-radius: 18px;

    font-size: 20px;
  }

  #bibliography {
    width: 90%;
  }

  .bibliography-list {
    padding:
      3px
      14px;

    border-radius: 15px;
  }

  .bibliography-item {
    padding:
      12px
      2px;

    font-size: 16px;
  }

  .arrow {
    font-size: 22px;
  }

  .instagram {
    font-size: 14px;

    padding:
      8px
      14px;
  }
}

</style>
</head>


<body>

<div class="container">


  <!-- LOGO -->

  <img
    class="logo"
    src="Recurso%201.png"
    alt="Historia para Close Friends"
  >


  <!-- FRASE -->

  <div class="tagline">

    <span class="tagline-text">
      Aprende historia
    </span>

    <span class="tagline-highlight">
      sin turra
    </span>

  </div>


  <!-- BOTONES -->

  <div id="mainButtons"></div>


  <!-- BIBLIOGRAFÍA -->

  <div id="bibliography"></div>


  <!-- INSTAGRAM -->

  <div class="footer">

    <div class="instagram">
      @historiaparaclosefriends
    </div>

  </div>


</div>


<script>


/* ==========================================
   GOOGLE SHEETS
   ========================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSe9B5yAgd1vKXrHcK-ZezCLKeK4PuJgUHIkX6MBLaSPercQTCdJzCjpv9RR6_bYVP5Xo0C9Smzax5p/pub?gid=0&single=true&output=csv";


/* ==========================================
   ICONOS
   ========================================== */

const icons = {

  "¡Escúchalo ya!": "🎧",

  "Último episodio": "🔥",

  "YouTube": "📹"

};


/* ==========================================
   LIMPIAR NOMBRES
   ========================================== */

function cleanName(name) {

  return String(name || "")
    .replace(
      /^[🎧🔥📹📚📖📄📕📗📘📙\s]+/,
      ""
    )
    .trim();

}


/* ==========================================
   PARSER CSV
   ========================================== */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const char = text[i];

    const next = text[i + 1];


    if (
      char === '"' &&
      next === '"'
    ) {

      value += '"';

      i++;

    }

    else if (
      char === '"'
    ) {

      insideQuotes =
        !insideQuotes;

    }

    else if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(value);

      value = "";

    }

    else if (
      (char === "\n" ||
       char === "\r") &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {
        i++;
      }

      row.push(value);

      rows.push(row);

      row = [];

      value = "";

    }

    else {

      value += char;

    }

  }


  if (
    value !== "" ||
    row.length > 0
  ) {

    row.push(value);

    rows.push(row);

  }


  return rows;

}


/* ==========================================
   CARGAR SHEET
   ========================================== */

async function loadLinks() {

  try {

    const response =
      await fetch(
        SHEET_URL + "&t=" + Date.now()
      );

    const csv =
      await response.text();

    const rows =
      parseCSV(csv);


    if (!rows.length) {
      return;
    }


    const headers =
      rows.shift()
        .map(
          header =>
            header.trim()
        );


    const data =
      rows.map(row => {

        const item = {};

        headers.forEach(
          (header, index) => {

            item[header] =
              (row[index] || "")
                .trim();

          }
        );

        return item;

      });


    renderPage(data);

  }

  catch (error) {

    console.error(
      "Error cargando Google Sheets:",
      error
    );

  }

}


/* ==========================================
   RENDERIZAR
   ========================================== */

function renderPage(data) {


  /* --------------------------------
     SOLO ACTIVOS
     -------------------------------- */

  const active =
    data.filter(item => {

      return String(
        item.Activo || ""
      ).toUpperCase() === "TRUE";

    });


  /* --------------------------------
     PRINCIPALES
     -------------------------------- */

  const principals =
    active
      .filter(item => {

        return (
          cleanName(item.Tipo) ===
          "Principal" &&
          cleanName(item.Nombre) !==
          "Bibliografía"
        );

      })
      .sort(
        (a, b) =>
          Number(a.Orden || 0) -
          Number(b.Orden || 0)
      );


  /* --------------------------------
     BIBLIOGRAFÍA
     -------------------------------- */

  const bibliography =
    active
      .filter(item => {

        const tipo =
          cleanName(item.Tipo);

        return (
          tipo === "Bibliografia" ||
          tipo === "Bibliografía"
        );

      })
      .sort(
        (a, b) =>
          Number(a.Orden || 0) -
          Number(b.Orden || 0)
      );


  /* =================================
     BOTONES PRINCIPALES
     ================================= */

  const main =
    document.getElementById(
      "mainButtons"
    );

  main.innerHTML = "";


  principals.forEach(item => {

    const name =
      cleanName(item.Nombre);

    const url =
      item.URL;


    if (!name || !url) {
      return;
    }


    const link =
      document.createElement("a");


    link.className =
      "main-button";


    link.href =
      url;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const icon =
      icons[name] || "";


    link.textContent =
      icon
        ? `${icon} ${name}`
        : name;


    main.appendChild(link);

  });


  /* =================================
     BIBLIOGRAFÍA
     ================================= */

  const container =
    document.getElementById(
      "bibliography"
    );


  /* MUY IMPORTANTE:
     SOLO SE CREA UN BOTÓN
     Y UNA LISTA.
  */

  container.innerHTML = "";


  const button =
    document.createElement("button");


  button.type =
    "button";


  button.className =
    "bibliography-button";


  button.innerHTML =
    "📚 Bibliografía <span>▼</span>";


  const list =
    document.createElement("div");


  list.className =
    "bibliography-list";


  bibliography.forEach(item => {

    const name =
      cleanName(item.Nombre);

    const url =
      item.URL;


    if (!name || !url) {
      return;
    }


    const link =
      document.createElement("a");


    link.className =
      "bibliography-item";


    link.href =
      url;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    link.innerHTML = `

      <span class="document">

        <span class="document-icon">
          📄
        </span>

        <span class="document-name">
          ${name}
        </span>

      </span>

      <span class="arrow">
        ↗
      </span>

    `;


    list.appendChild(link);

  });


  /* =================================
     ABRIR / CERRAR
     ================================= */

  button.addEventListener(
    "click",
    () => {

      const isOpen =
        list.classList.toggle(
          "open"
        );


      button.innerHTML =
        isOpen
          ? "📚 Bibliografía <span>▲</span>"
          : "📚 Bibliografía <span>▼</span>";

    }
  );


  container.appendChild(
    button
  );

  container.appendChild(
    list
  );

}


/* ==========================================
   ARRANCAR
   ========================================== */

loadLinks();

</script>

</body>
</html>
