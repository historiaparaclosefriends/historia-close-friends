<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Historia para Close Friends</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background-color: #eeece1;

      background-image:
        radial-gradient(
          #d8d5c9 2px,
          transparent 2px
        );

      background-size: 14px 14px;

      color: #222;
    }


    /* =========================
       CONTENEDOR
       ========================= */

    .container {

      width: min(900px, 88%);

      margin: 0 auto;

      padding:
        25px
        0
        45px;

      text-align: center;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {

      display: block;

      width: min(520px, 78%);

      height: auto;

      margin:
        0 auto 8px;
    }


    /* =========================
       FRASE
       ========================= */

    .tagline {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 8px;

      margin:
        4px auto 28px;

      font-size: 28px;

      font-weight: 800;

      line-height: 1;
    }

    .tagline span {

      background: #58d05c;

      color: white;

      padding:
        9px
        18px;

      border-radius: 13px;

      font-weight: 800;
    }


    /* =========================
       BOTONES
       ========================= */

    #mainButtons {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 12px;
    }

    .main-button {

      display: flex;

      align-items: center;

      justify-content: center;

      width: min(760px, 100%);

      min-height: 64px;

      padding:
        12px
        20px;

      border: none;

      border-radius: 24px;

      background: #fffdfb;

      color: #222;

      text-decoration: none;

      font-size: 25px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .main-button:hover {

      transform: translateY(-2px);

      background: #ffffff;
    }


    /* =========================
       BIBLIOGRAFÍA
       ========================= */

    .bibliography-wrapper {

      width: min(760px, 100%);

      margin: 0 auto;
    }

    .bibliography-button {

      width: 100%;

      min-height: 64px;

      margin: 0;

      border: none;

      border-radius: 24px;

      background: #fffdfb;

      color: #222;

      font-size: 25px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .bibliography-button:hover {

      transform: translateY(-2px);

      background: #ffffff;
    }


    /* =========================
       LISTA DE BIBLIOGRAFÍA
       ========================= */

    .bibliography-list {

      display: none;

      width: 100%;

      margin-top: 8px;

      padding:
        5px
        25px;

      background: #fffdfb;

      border-radius: 18px;

      text-align: left;
    }

    .bibliography-list.open {

      display: block;
    }


    .bibliography-item {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      padding:
        17px
        5px;

      border-bottom:
        1px dashed #f2b6ce;

      color: #222;

      text-decoration: none;

      font-size: 20px;

      font-weight: 700;

      transition:
        color 0.15s ease;
    }

    .bibliography-item:last-child {

      border-bottom: none;
    }

    .bibliography-item:hover {

      color: #0877ed;
    }

    .bibliography-item .document {

      display: flex;

      align-items: center;

      gap: 12px;
    }

    .bibliography-item .arrow {

      font-size: 27px;

      font-weight: 400;

      color: #222;

      transition:
        color 0.15s ease;
    }

    .bibliography-item:hover .arrow {

      color: #0877ed;
    }


    /* =========================
       FOOTER
       ========================= */

    .footer {

      margin-top: 28px;

      text-align: center;
    }

    .instagram {

      display: inline-block;

      padding:
        9px
        20px;

      border-radius: 16px;

      background: #FFDBF2;

      color: #ed711a;

      font-size: 18px;

      font-weight: 800;

      text-decoration: none;
    }


    /* =========================
       MÓVIL
       ========================= */

    @media (max-width: 600px) {

      .container {

        width: 92%;

        padding-top: 18px;
      }

      .logo {

        width: 90%;

        margin-bottom: 3px;
      }

      .tagline {

        font-size: 20px;

        gap: 5px;

        margin-bottom: 20px;
      }

      .tagline span {

        padding:
          7px
          12px;

        border-radius: 10px;
      }

      .main-button,
      .bibliography-button {

        min-height: 54px;

        border-radius: 19px;

        font-size: 21px;

        padding:
          10px
          15px;
      }

      #mainButtons {

        gap: 9px;
      }

      .bibliography-item {

        font-size: 17px;

        padding:
          14px
          2px;
      }

      .bibliography-list {

        padding:
          3px
          16px;
      }

      .instagram {

        font-size: 15px;

        padding:
          8px
          16px;
      }
    }

  </style>

</head>


<body>

  <div class="container">


    <!-- LOGO -->

    <img
      id="logo"
      class="logo"
      alt="Historia para Close Friends"
    >


    <!-- FRASE -->

    <div class="tagline">

      <span style="
        background: none;
        color: #222;
        padding: 0;
      ">
        Aprende historia
      </span>

      <span>
        sin turra
      </span>

    </div>


    <!-- BOTONES -->

    <div id="mainButtons"></div>


    <!-- BIBLIOGRAFÍA -->

    <div
      id="bibliography"
      class="bibliography-wrapper"
    ></div>


    <!-- FOOTER -->

    <div class="footer">

      <div class="instagram">
        @historiaparaclosefriends
      </div>

    </div>


  </div>


  <script>


    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */

    const SHEET_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSe9B5yAgd1vKXrHcK-ZezCLKeK4PuJgUHIkX6MBLaSPercQTCdJzCjpv9RR6_bYVP5Xo0C9Smzax5p/pub?gid=0&single=true&output=csv";


    /* =====================================================
       ICONOS
       ===================================================== */

    const icons = {

      "¡Escúchalo ya!": "🎧",

      "Último episodio": "🔥",

      "YouTube": "📹"

    };


    /* =====================================================
       CARGAR LOGO
       ===================================================== */

    document.getElementById("logo").src =
      "fons.png";


    /* =====================================================
       LEER CSV
       ===================================================== */

    async function loadLinks() {

      try {

        const response =
          await fetch(SHEET_URL);

        const csv =
          await response.text();

        const rows =
          parseCSV(csv);

        if (!rows.length) {
          return;
        }

        const headers =
          rows.shift();

        const data =
          rows.map(row => {

            const item = {};

            headers.forEach(
              (header, index) => {

                item[header.trim()] =
                  (row[index] || "").trim();

              }
            );

            return item;

          });

        renderPage(data);

      }

      catch (error) {

        console.error(
          "Error cargando los enlaces:",
          error
        );

      }

    }


    /* =====================================================
       PARSER CSV
       ===================================================== */

    function parseCSV(text) {

      const rows = [];

      let row = [];

      let value = "";

      let insideQuotes = false;


      for (
        let i = 0;
        i < text.length;
        i++
      ) {

        const char =
          text[i];

        const next =
          text[i + 1];


        if (
          char === '"' &&
          next === '"'
        ) {

          value += '"';

          i++;

        }

        else if (
          char === '"'
        ) {

          insideQuotes =
            !insideQuotes;

        }

        else if (
          char === "," &&
          !insideQuotes
        ) {

          row.push(value);

          value = "";

        }

        else if (
          (char === "\n" ||
           char === "\r") &&
          !insideQuotes
        ) {

          if (
            char === "\r" &&
            next === "\n"
          ) {

            i++;

          }

          row.push(value);

          rows.push(row);

          row = [];

          value = "";

        }

        else {

          value += char;

        }

      }


      if (value !== "" || row.length) {

        row.push(value);

        rows.push(row);

      }


      return rows;

    }


    /* =====================================================
       LIMPIAR NOMBRE
       ===================================================== */

    function cleanName(name) {

      return name
        .replace(
          /^[🎧🔥📹📚📖📄📕📗📘📙\s]+/,
          ""
        )
        .trim();

    }


    /* =====================================================
       ICONO DEL BOTÓN
       ===================================================== */

    function getIcon(name) {

      const clean =
        cleanName(name);

      return icons[clean] || "";

    }


    /* =====================================================
       RENDERIZAR
       ===================================================== */

    function renderPage(data) {


      /* -------------------------
         FILTRAR ACTIVOS
         ------------------------- */

      const active =
        data.filter(item => {

          return (
            String(item.Activo)
              .toUpperCase()
              === "TRUE"
          );

        });


      /* -------------------------
         PRINCIPALES
         ------------------------- */

      const principals =
        active
          .filter(item =>
            item.Tipo === "Principal" &&
            cleanName(item.Nombre)
              !== "Bibliografía"
          )
          .sort(
            (a, b) =>
              Number(a.Orden || 0) -
              Number(b.Orden || 0)
          );


      /* -------------------------
         BIBLIOGRAFÍA
         ------------------------- */

      const bibliography =
        active
          .filter(item =>
            item.Tipo === "Bibliografia" ||
            item.Tipo === "Bibliografía"
          )
          .sort(
            (a, b) =>
              Number(a.Orden || 0) -
              Number(b.Orden || 0)
          );


      /* =================================================
         CREAR BOTONES PRINCIPALES
         ================================================= */

      const main =
        document.getElementById(
          "mainButtons"
        );

      main.innerHTML = "";


      principals.forEach(item => {

        const name =
          cleanName(item.Nombre);

        const button =
          document.createElement("a");

        button.className =
          "main-button";

        button.href =
          item.URL;

        button.target =
          "_blank";

        button.rel =
          "noopener noreferrer";


        const icon =
          getIcon(name);


        button.textContent =
          icon
            ? `${icon} ${name}`
            : name;


        main.appendChild(button);

      });


      /* =================================================
         BIBLIOGRAFÍA
         ================================================= */

      const bibliographyContainer =
        document.getElementById(
          "bibliography"
        );


      bibliographyContainer.innerHTML = "";


      const wrapper =
        document.createElement("div");

      wrapper.className =
        "bibliography-wrapper";


      /* BOTÓN */

      const button =
        document.createElement("button");

      button.className =
        "bibliography-button";

      button.innerHTML =
        "📚 Bibliografía <span>▼</span>";


      /* LISTA */

      const list =
        document.createElement("div");

      list.className =
        "bibliography-list";


      bibliography.forEach(item => {

        const link =
          document.createElement("a");

        link.className =
          "bibliography-item";

        link.href =
          item.URL;

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";


        const documentPart =
          document.createElement("span");

        documentPart.className =
          "document";


        documentPart.innerHTML =
          `
            <span>📄</span>
            <span>
              ${cleanName(item.Nombre)}
            </span>
          `;


        const arrow =
          document.createElement("span");

        arrow.className =
          "arrow";

        arrow.textContent =
          "↗";


        link.appendChild(
          documentPart
        );

        link.appendChild(
          arrow
        );


        list.appendChild(link);

      });


      /* ABRIR / CERRAR */

      button.addEventListener(
        "click",
        () => {

          const isOpen =
            list.classList.toggle(
              "open"
            );


          button.innerHTML =
            isOpen
              ? "📚 Bibliografía <span>▲</span>"
              : "📚 Bibliografía <span>▼</span>";

        }
      );


      wrapper.appendChild(
        button
      );

      wrapper.appendChild(
        list
      );


      bibliographyContainer.appendChild(
        wrapper
      );

    }


    /* =====================================================
       INICIAR
       ===================================================== */

    loadLinks();


  </script>

</body>

</html>
