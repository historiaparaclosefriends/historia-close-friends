<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Historia para Close Friends</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 40px 20px 50px;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #222;

      background-color: #f4f0e8;

      background-image: url("fons.png");

      background-repeat: no-repeat;

      background-position: center top;

      background-size: cover;

      background-attachment: fixed;
    }


    /* =========================
       CONTENEDOR
       ========================= */

    .container {

      width: 100%;

      max-width: 900px;

      margin: 0 auto;

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {

      display: block;

      width: min(560px, 90vw);

      height: auto;

      margin: 0 auto 18px;
    }


    /* =========================
       FRASE
       ========================= */

    .tagline {

      display: flex;

      align-items: center;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;

      margin: 0 auto 35px;

      font-size: clamp(25px, 4vw, 42px);

      font-weight: 800;

      line-height: 1.1;

      text-align: center;
    }


    .tagline span {

      display: inline-block;

      padding: 10px 20px;

      border-radius: 14px;

      background: #62CE61;

      color: white;

      font-weight: 800;

      white-space: nowrap;
    }


    /* =========================
       BOTONES
       ========================= */

    #mainButtons {

      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 18px;

      margin-bottom: 18px;
    }


    .main-button {

      width: min(820px, 94vw);

      min-height: 82px;

      padding: 18px 25px;

      border: none;

      border-radius: 28px;

      background: rgba(255, 253, 250, 0.96);

      color: #222;

      font-family: inherit;

      font-size: clamp(22px, 3vw, 31px);

      font-weight: 800;

      text-align: center;

      text-decoration: none;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background-color 0.15s ease;
    }


    .main-button:hover {

      transform: scale(1.015);

      background: white;
    }


    .main-button:active {

      transform: scale(0.985);
    }


    /* =========================
       BIBLIOGRAFÍA
       ========================= */

    .bibliography-wrapper {

      width: min(820px, 94vw);

      margin-top: 0;
    }


    .bibliography-button {

      width: 100%;

      min-height: 82px;

      padding: 18px 25px;

      border: none;

      border-radius: 28px;

      background: rgba(255, 253, 250, 0.96);

      color: #222;

      font-family: inherit;

      font-size: clamp(22px, 3vw, 31px);

      font-weight: 800;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      transition:
        transform 0.15s ease,
        background-color 0.15s ease;
    }


    .bibliography-button:hover {

      transform: scale(1.015);

      background: white;
    }


    .bibliography-button:active {

      transform: scale(0.985);
    }


    .bibliography-arrow {

      display: inline-block;

      font-size: 0.8em;

      transition: transform 0.2s ease;
    }


    .bibliography-button.open
    .bibliography-arrow {

      transform: rotate(180deg);
    }


    .bibliography-content {

      display: none;

      width: 100%;

      margin-top: 12px;

      padding: 18px;

      border-radius: 22px;

      background: rgba(255, 253, 250, 0.96);
    }


    .bibliography-content.open {

      display: block;
    }


    .bibliography-link {

      display: block;

      padding: 14px 10px;

      color: #0072F2;

      font-size: 18px;

      font-weight: 700;

      text-decoration: none;

      border-bottom: 1px solid #e5e5e5;
    }


    .bibliography-link:last-child {

      border-bottom: none;
    }


    .bibliography-link:hover {

      text-decoration: underline;
    }


    /* =========================
       MENSAJE DE CARGA / ERROR
       ========================= */

    .loading {

      width: min(820px, 94vw);

      padding: 25px;

      text-align: center;

      font-size: 18px;

      color: #555;
    }


    .error {

      width: min(820px, 94vw);

      padding: 20px;

      border-radius: 20px;

      background: #fff;

      color: #c0392b;

      text-align: center;

      font-weight: 700;
    }


    /* =========================
       FOOTER
       ========================= */

    .footer {

      margin-top: 38px;

      display: flex;

      justify-content: center;
    }


    .instagram {

      display: inline-block;

      padding: 13px 28px;

      border-radius: 16px;

      background: #88C8FF;

      color: #0072F2;

      font-size: clamp(17px, 2.5vw, 23px);

      font-weight: 800;

      text-align: center;

      text-decoration: none;
    }


    /* =========================
       MÓVIL
       ========================= */

    @media (max-width: 600px) {

      body {

        padding:
          24px
          14px
          35px;

        background-attachment: scroll;

        background-position: center top;

      }


      .logo {

        width: min(500px, 96vw);

        margin-bottom: 12px;
      }


      .tagline {

        margin-bottom: 25px;

        gap: 7px;

        font-size: 25px;
      }


      .tagline span {

        padding: 8px 14px;

        border-radius: 11px;
      }


      #mainButtons {

        gap: 13px;

        margin-bottom: 13px;
      }


      .main-button,
      .bibliography-button {

        width: 94vw;

        min-height: 66px;

        padding: 14px 18px;

        border-radius: 22px;

        font-size: 21px;
      }


      .bibliography-content {

        padding: 12px;

        border-radius: 18px;
      }


      .bibliography-link {

        font-size: 16px;

        padding: 13px 8px;
      }


      .footer {

        margin-top: 28px;
      }


      .instagram {

        padding: 11px 20px;

        border-radius: 14px;

        font-size: 16px;
      }

    }

  </style>
</head>


<body>

  <div class="container">


    <!-- =========================
         LOGO
         ========================= -->

    <img
      id="logo"
      class="logo"
      src="Recurso%201.png"
      alt="Historia para Close Friends"
    >


    <!-- =========================
         FRASE
         ========================= -->

    <div class="tagline">

      <span>Aprende historia</span>

      <span>sin turra</span>

    </div>


    <!-- =========================
         BOTONES PRINCIPALES
         ========================= -->

    <div id="mainButtons">

      <div class="loading">
        Cargando...
      </div>

    </div>


    <!-- =========================
         BIBLIOGRAFÍA
         ========================= -->

    <div
      id="bibliography"
      class="bibliography-wrapper"
      style="display:none;"
    >

      <button
        id="bibliographyButton"
        class="bibliography-button"
        type="button"
      >

        <span>📚 Bibliografía</span>

        <span class="bibliography-arrow">▼</span>

      </button>


      <div
        id="bibliographyContent"
        class="bibliography-content"
      ></div>

    </div>


    <!-- =========================
         FOOTER
         ========================= -->

    <div class="footer">

      <div class="instagram">

        @historiaparaclosefriends

      </div>

    </div>


  </div>


  <script>

    /* =========================================================
       GOOGLE SHEETS
       ========================================================= */

    const SHEET_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSe9B5yAgd1vKXrHcK-ZezCLKeK4PuJgUHIkX6MBLaSPercQTCdJzCjpv9RR6_bYVP5Xo0C9Smzax5p/pub?gid=0&single=true&output=csv";


    /* =========================================================
       ELEMENTOS
       ========================================================= */

    const mainButtons =
      document.getElementById("mainButtons");

    const bibliography =
      document.getElementById("bibliography");

    const bibliographyButton =
      document.getElementById("bibliographyButton");

    const bibliographyContent =
      document.getElementById("bibliographyContent");


    /* =========================================================
       ESCAPAR HTML
       ========================================================= */

    function escapeHTML(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================================
       CSV PARSER
       ========================================================= */

    function parseCSV(text) {

      const rows = [];

      let row = [];

      let value = "";

      let insideQuotes = false;


      for (let i = 0; i < text.length; i++) {

        const char = text[i];

        const next = text[i + 1];


        if (char === '"' && insideQuotes && next === '"') {

          value += '"';

          i++;

          continue;
        }


        if (char === '"') {

          insideQuotes = !insideQuotes;

          continue;
        }


        if (char === "," && !insideQuotes) {

          row.push(value);

          value = "";

          continue;
        }


        if (
          (char === "\n" || char === "\r") &&
          !insideQuotes
        ) {

          if (char === "\r" && next === "\n") {

            i++;
          }

          row.push(value);

          rows.push(row);

          row = [];

          value = "";

          continue;
        }


        value += char;
      }


      if (value !== "" || row.length > 0) {

        row.push(value);

        rows.push(row);
      }


      return rows;
    }


    /* =========================================================
       NORMALIZAR TEXTO
       ========================================================= */

    function normalize(value) {

      return String(value || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }


    /* =========================================================
       CARGAR ENLACES
       ========================================================= */

    async function loadLinks() {

      try {

        const response =
          await fetch(
            SHEET_URL + "&_=" + Date.now(),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "No se ha podido cargar la hoja."
          );
        }


        const csv =
          await response.text();


        const rows =
          parseCSV(csv);


        if (rows.length < 2) {

          throw new Error(
            "La hoja no contiene enlaces."
          );
        }


        /*
         * Columnas esperadas:
         *
         * 0 = tipo
         * 1 = nombre
         * 2 = url
         * 3 = activo
         * 4 = orden
         */


        const links =
          rows
            .slice(1)
            .filter(row =>
              row[0] &&
              row[2]
            )
            .map(row => ({

              tipo:
                String(row[0]).trim(),

              nombre:
                String(row[1] || "").trim(),

              url:
                String(row[2] || "").trim(),

              activo:
                normalize(row[3]) === "true" ||
                normalize(row[3]) === "si" ||
                normalize(row[3]) === "1",

              orden:
                Number(row[4]) || 0

            }))
            .filter(link =>
              link.activo &&
              link.url
            )
            .sort((a, b) =>
              a.orden - b.orden
            );


        renderLinks(links);

      } catch (error) {

        console.error(error);


        mainButtons.innerHTML = `

          <div class="error">

            No se han podido cargar los enlaces.

          </div>

        `;
      }
    }


    /* =========================================================
       CREAR BOTÓN
       ========================================================= */

    function createButton(link) {

      const a =
        document.createElement("a");


      a.className =
        "main-button";


      a.href =
        link.url;


      a.target =
        "_blank";


      a.rel =
        "noopener noreferrer";


      a.textContent =
        link.nombre;


      return a;
    }


    /* =========================================================
       IDENTIFICAR BIBLIOGRAFÍA
       ========================================================= */

    function isBibliography(link) {

      const type =
        normalize(link.tipo);


      return (
        type.includes("bibliograf") ||
        type.includes("fuente") ||
        type.includes("libro") ||
        type.includes("referencia")
      );
    }


    /* =========================================================
       RENDERIZAR ENLACES
       ========================================================= */

    function renderLinks(links) {

      mainButtons.innerHTML = "";

      bibliographyContent.innerHTML = "";


      const mainLinks =
        links.filter(link =>
          !isBibliography(link)
        );


      const bibliographyLinks =
        links.filter(link =>
          isBibliography(link)
        );


      /*
       * BOTONES PRINCIPALES
       */

      mainLinks.forEach(link => {

        const button =
          createButton(link);

        mainButtons.appendChild(
          button
        );

      });


      /*
       * BIBLIOGRAFÍA
       */

      bibliographyLinks.forEach(link => {

        const a =
          document.createElement("a");


        a.className =
          "bibliography-link";


        a.href =
          link.url;


        a.target =
          "_blank";


        a.rel =
          "noopener noreferrer";


        a.textContent =
          link.nombre;


        bibliographyContent.appendChild(
          a
        );

      });


      /*
       * Si hay bibliografía,
       * mostramos el botón.
       */

      if (bibliographyLinks.length > 0) {

        bibliography.style.display =
          "block";

      } else {

        bibliography.style.display =
          "none";
      }

    }


    /* =========================================================
       ABRIR / CERRAR BIBLIOGRAFÍA
       ========================================================= */

    bibliographyButton.addEventListener(
      "click",
      function() {

        const isOpen =
          bibliographyContent.classList.contains(
            "open"
          );


        bibliographyContent.classList.toggle(
          "open"
        );


        bibliographyButton.classList.toggle(
          "open"
        );

      }
    );


    /* =========================================================
       INICIAR
       ========================================================= */

    loadLinks();

  </script>

</body>
</html>
