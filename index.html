<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Historia para Close Friends</title>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
  --cream: #f7f4eb;
  --white: #fffdfa;
  --black: #222222;
  --green: #58d05c;
  --blue: #0878ff;
  --pink: #FFDBF2;
  --orange: #ed711a;
  --line: #f4b9d2;
}


/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;

  background:
    url("fons.png")
    center top
    / cover
    fixed;

  color: var(--black);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height: 100vh;
}


/* =========================================================
   CONTENEDOR
========================================================= */

.page {
  width: 100%;
  max-width: 760px;

  margin: 0 auto;

  padding:
    28px
    24px
    45px;
}


/* =========================================================
   CABECERA
========================================================= */

.header {
  text-align: center;

  margin-bottom: 26px;
}


/* LOGO */

.logo {
  display: block;

  width: min(100%, 610px);

  height: auto;

  margin: 0 auto 8px;
}


/* =========================================================
   FRASE
========================================================= */

.tagline {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 8px;

  font-size: clamp(20px, 3.5vw, 29px);

  font-weight: 800;

  line-height: 1;

  margin-top: 0;

  margin-bottom: 25px;
}

.tagline span {
  background: var(--green);

  color: white;

  padding:
    8px
    15px;

  border-radius: 13px;

  white-space: nowrap;
}


/* =========================================================
   BOTONES PRINCIPALES
========================================================= */

#mainButtons {
  display: flex;

  flex-direction: column;

  gap: 12px;
}


/* BOTÓN */

.main-button {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 100%;

  min-height: 62px;

  padding:
    12px
    20px;

  border: none;

  border-radius: 25px;

  background: var(--white);

  color: var(--black);

  text-decoration: none;

  font-size: 23px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,0.06);

  transition:
    transform .15s ease,
    color .15s ease,
    box-shadow .15s ease;
}


/* HOVER */

.main-button:hover {
  color: var(--blue);

  transform: translateY(-2px);

  box-shadow:
    0 7px 16px
    rgba(0,0,0,0.09);
}


/* =========================================================
   BIBLIOGRAFÍA
========================================================= */

.bibliography-wrapper {
  margin-top: 12px;
}


/* BOTÓN BIBLIOGRAFÍA */

.bibliography-toggle {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 100%;

  min-height: 62px;

  padding:
    12px
    20px;

  border: none;

  border-radius: 25px;

  background: var(--white);

  color: var(--black);

  font-family: inherit;

  font-size: 23px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,0.06);

  transition:
    color .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.bibliography-toggle:hover {
  color: var(--blue);

  transform: translateY(-2px);
}

.bibliography-toggle .arrow {
  margin-left: 8px;

  font-size: 18px;

  transition:
    transform .2s ease;
}

.bibliography-toggle.open .arrow {
  transform: rotate(180deg);
}


/* =========================================================
   LISTA BIBLIOGRAFÍA
========================================================= */

.bibliography-list {
  display: none;

  margin-top: 7px;

  padding:
    5px
    20px;

  background: var(--white);

  border-radius: 25px;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,0.04);

  overflow: hidden;
}

.bibliography-list.open {
  display: block;
}


/* RECURSO */

.bibliography-item {
  display: flex;

  align-items: center;

  min-height: 66px;

  padding:
    10px
    4px;

  border-bottom:
    1px dashed var(--line);

  text-decoration: none;

  color: var(--black);

  transition:
    color .15s ease,
    padding-left .15s ease;
}

.bibliography-item:last-child {
  border-bottom: none;
}


/* HOVER AZUL */

.bibliography-item:hover {
  color: var(--blue);

  padding-left: 9px;
}


/* ICONO DOCUMENTO */

.document-icon {
  flex: 0 0 auto;

  margin-right: 13px;

  font-size: 20px;

  opacity: .75;
}


/* NOMBRE */

.bibliography-name {
  flex: 1;

  font-size: 18px;

  font-weight: 700;

  line-height: 1.2;
}


/* FLECHA */

.external-arrow {
  flex: 0 0 auto;

  margin-left: 15px;

  font-size: 27px;

  font-weight: 300;

  line-height: 1;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
  display: flex;

  justify-content: center;

  margin-top: 28px;
}

.instagram {
  display: inline-block;

  padding:
    9px
    18px;

  border-radius: 15px;

  background: var(--pink);

  color: var(--orange);

  font-size: 16px;

  font-weight: 800;

  text-decoration: none;
}


/* =========================================================
   MÓVIL
========================================================= */

@media (max-width: 600px) {

  .page {
    padding:
      18px
      14px
      35px;
  }

  .header {
    margin-bottom: 20px;
  }

  .logo {
    width: 100%;
    margin-bottom: 4px;
  }

  .tagline {
    font-size: 19px;

    gap: 6px;

    margin-bottom: 20px;
  }

  .tagline span {
    padding:
      7px
      11px;

    border-radius: 11px;
  }

  .main-button,
  .bibliography-toggle {
    min-height: 56px;

    border-radius: 22px;

    font-size: 20px;

    padding:
      10px
      14px;
  }

  #mainButtons {
    gap: 10px;
  }

  .bibliography-wrapper {
    margin-top: 10px;
  }

  .bibliography-list {
    padding:
      4px
      14px;

    border-radius: 22px;
  }

  .bibliography-item {
    min-height: 57px;
  }

  .bibliography-name {
    font-size: 16px;
  }

  .document-icon {
    margin-right: 9px;

    font-size: 17px;
  }

  .external-arrow {
    font-size: 23px;

    margin-left: 10px;
  }

  .instagram {
    font-size: 14px;

    padding:
      8px
      14px;
  }
}


/* =========================================================
   MÓVILES MUY PEQUEÑOS
========================================================= */

@media (max-width: 380px) {

  .tagline {
    font-size: 17px;
  }

  .main-button,
  .bibliography-toggle {
    font-size: 18px;
  }

  .bibliography-name {
    font-size: 15px;
  }
}

</style>

</head>


<body>


<div class="page">


  <!-- =====================================================
       CABECERA
  ====================================================== -->

  <header class="header">

    <img
      src="Recurso%201.png"
      class="logo"
      alt="Historia para Close Friends"
    >

    <div class="tagline">

      <span style="
        background:none;
        color:var(--black);
        padding:0;
      ">
        Aprende historia
      </span>

      <span>
        sin turra
      </span>

    </div>

  </header>


  <!-- =====================================================
       BOTONES
  ====================================================== -->

  <div id="mainButtons"></div>


  <!-- =====================================================
       BIBLIOGRAFÍA
  ====================================================== -->

  <div class="bibliography-wrapper">

    <button
      id="bibliographyToggle"
      class="bibliography-toggle"
      type="button"
    >

      📚 Bibliografía

      <span class="arrow">
        ▼
      </span>

    </button>


    <div
      id="bibliographyList"
      class="bibliography-list"
    ></div>

  </div>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="footer">

    <div class="instagram">
      @historiaparaclosefriends
    </div>

  </footer>


</div>



<script>

/* =========================================================
   GOOGLE SHEETS
========================================================= */

const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSe9B5yAgd1vKXrHcK-ZezCLKeK4PuJgUHIkX6MBLaSPercQTCdJzCjpv9RR6_bYVP5Xo0C9Smzax5p/pub?gid=0&single=true&output=csv";


/* =========================================================
   EMOJIS
========================================================= */

function getEmoji(name) {

  const text =
    String(name)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

  if (
    text.includes("escuch") ||
    text.includes("podcast") ||
    text.includes("spotify")
  ) {
    return "🎧";
  }

  if (
    text.includes("ultimo") ||
    text.includes("episodio")
  ) {
    return "🔥";
  }

  if (
    text.includes("youtube") ||
    text.includes("video")
  ) {
    return "📹";
  }

  if (
    text.includes("bibliografia") ||
    text.includes("bibliografía")
  ) {
    return "📚";
  }

  return "";
}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes = false;


  for (let i = 0; i < text.length; i++) {

    const char = text[i];

    const next = text[i + 1];


    if (char === '"' && insideQuotes && next === '"') {

      value += '"';

      i++;

      continue;
    }


    if (char === '"') {

      insideQuotes = !insideQuotes;

      continue;
    }


    if (char === "," && !insideQuotes) {

      row.push(value);

      value = "";

      continue;
    }


    if (
      (char === "\n" || char === "\r") &&
      !insideQuotes
    ) {

      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(value);

      rows.push(row);

      row = [];

      value = "";

      continue;
    }


    value += char;
  }


  if (value !== "" || row.length > 0) {

    row.push(value);

    rows.push(row);
  }


  return rows;
}


/* =========================================================
   CARGAR ENLACES
========================================================= */

async function loadLinks() {

  try {

    const response =
      await fetch(SHEET_URL + "&t=" + Date.now());

    if (!response.ok) {
      throw new Error("No se pudo cargar Google Sheets.");
    }

    const csv =
      await response.text();

    const rows =
      parseCSV(csv);


    if (rows.length < 2) {
      throw new Error("La hoja está vacía.");
    }


    /* CABECERAS */

    const headers =
      rows[0].map(
        h => h.trim().toLowerCase()
      );


    const tipoIndex =
      headers.indexOf("tipo");

    const nombreIndex =
      headers.indexOf("nombre");

    const urlIndex =
      headers.indexOf("url");

    const activoIndex =
      headers.indexOf("activo");

    const ordenIndex =
      headers.indexOf("orden");


    /* DATOS */

    const links =
      rows
        .slice(1)
        .map(row => ({

          tipo:
            row[tipoIndex] || "",

          nombre:
            row[nombreIndex] || "",

          url:
            row[urlIndex] || "",

          activo:
            String(
              row[activoIndex] || ""
            )
              .trim()
              .toLowerCase(),

          orden:
            Number(
              row[ordenIndex]
            ) || 0

        }))
        .filter(item => {

          return (
            item.nombre.trim() !== "" &&
            item.url.trim() !== "" &&
            (
              item.activo === "true" ||
              item.activo === "sí" ||
              item.activo === "si" ||
              item.activo === "1"
            )
          );

        });


    links.sort(
      (a, b) =>
        a.orden - b.orden
    );


    renderMainButtons(links);

    renderBibliography(links);


  } catch (error) {

    console.error(error);

    document.getElementById(
      "mainButtons"
    ).innerHTML = `
      <div style="
        text-align:center;
        padding:20px;
        color:#666;
        font-size:14px;
      ">
        No se han podido cargar los enlaces.
      </div>
    `;

  }

}


/* =========================================================
   BOTONES PRINCIPALES
========================================================= */

function renderMainButtons(links) {

  const container =
    document.getElementById(
      "mainButtons"
    );


  const bibliography =
    links.filter(item =>
      item.tipo
        .toLowerCase()
        .includes("bibli")
    );


  const main =
    links.filter(item =>
      !item.tipo
        .toLowerCase()
        .includes("bibli")
    );


  /* Solo mostramos los botones principales */

  main.forEach(item => {

    const button =
      document.createElement("a");


    button.className =
      "main-button";


    button.href =
      item.url;


    button.target =
      "_blank";


    button.rel =
      "noopener noreferrer";


    const emoji =
      getEmoji(item.nombre);


    button.textContent =
      emoji
        ? `${emoji} ${item.nombre}`
        : item.nombre;


    container.appendChild(button);

  });

}


/* =========================================================
   BIBLIOGRAFÍA
========================================================= */

function renderBibliography(links) {

  const container =
    document.getElementById(
      "bibliographyList"
    );


  const bibliography =
    links
      .filter(item =>
        item.tipo
          .toLowerCase()
          .includes("bibli")
      );


  bibliography.forEach(item => {

    const link =
      document.createElement("a");


    link.className =
      "bibliography-item";


    link.href =
      item.url;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    link.innerHTML = `

      <span class="document-icon">
        📄
      </span>

      <span class="bibliography-name">
        ${escapeHTML(item.nombre)}
      </span>

      <span class="external-arrow">
        ↗
      </span>

    `;


    container.appendChild(link);

  });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   DESPLEGABLE
========================================================= */

const bibliographyToggle =
  document.getElementById(
    "bibliographyToggle"
  );

const bibliographyList =
  document.getElementById(
    "bibliographyList"
  );


bibliographyToggle.addEventListener(
  "click",
  () => {

    const isOpen =
      bibliographyList.classList.toggle(
        "open"
      );


    bibliographyToggle.classList.toggle(
      "open",
      isOpen
    );

  }
);


/* =========================================================
   INICIAR
========================================================= */

loadLinks();

</script>


</body>

</html>
